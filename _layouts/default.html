<!DOCTYPE html>
{% assign is_english = false %}
{% if page.lang == 'en' or page.collection == 'en_posts' or page.url contains '/en/' %}
  {% assign is_english = true %}
{% endif %}
<html lang="{% if is_english %}en{% else %}ko{% endif %}">
  {% include head.html %}
  <body data-page-type="{% if page.url contains 'search' %}search{% elsif page.url contains 'archive' %}archive{% elsif page.url contains 'about' %}about{% elsif page.layout == 'post' %}post{% else %}default{% endif %}">
    {{ content }}
    {% include javascripts.html %}
    {% include analytics.html %}
  </body>
</html>
